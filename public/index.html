  <style>
    :root {
      --bg: #080d0f;
      --panel: #11191b;
      --panel-strong: #182326;
      --soft: rgba(0, 255, 163, 0.12);
      --line: rgba(255, 255, 255, 0.09);
      --green: #00ffa3;
      --green-dark: #00d98b;
      --text: #f5f8f7;

      --sidebar: 360px;
      --chat-width: 360;
      --chat-height: 640;

    :root[data-theme="light"] {
      --bg: #edf5f2;
      --panel: #ffffff;
      --panel-strong: #f3f8f6;
      --soft: rgba(0, 180, 115, 0.12);

      --green: #00a86b;

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {

      background: var(--bg);

    .sidebar {

      top: 0;
      bottom: 0;

      width: var(--sidebar);

    input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 999px; background: linear-gradient(to right, var(--green) var(--range-progress), var(--scrollbar) var(--range-progress)); }

    .sidebar-footer { display: grid; flex-shrink: 0; gap: 7px; padding: 0 15px 12px; }

      display: grid;
      isolation: isolate;
      flex: 1;
      grid-auto-rows: calc(var(--chat-height) * 1px);

      justify-content: start;

      overflow-y: auto;
      padding: 15px;

    .chat {
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;

    .chat-resizer {
      position: absolute;
      right: 0;
      bottom: 0;
      z-index: 2;
      display: grid;
      place-items: center;

      height: 36px;
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);

      color: var(--green);

    .chat-resizer svg { width: 22px; height: 22px; pointer-events: none; }
    .chat-resizer:hover, body.resizing-chats .chat-resizer { border-color: var(--green); background: var(--green); color: #05271c; }
    body.resizing-chats { cursor: nwse-resize; user-select: none; }
    .chat-header {
      display: flex;
      min-height: 42px;
      align-items: center;
      gap: 7px;

      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .chat-header .profile { width: 32px; height: 32px; flex-basis: 32px; }
    .chat-header .name { min-width: 0; color: var(--green); font-size: 17px; font-weight: 900; line-height: 1.3; }
    .chat-actions { display: flex; flex-shrink: 0; gap: 2px; }
    .empty-state {
      display: grid;
      min-height: calc(100vh - 30px);
      place-items: center;
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }
    .empty-state strong { display: block; margin-bottom: 8px; color: var(--text); font-size: 18px; }
    ::-webkit-scrollbar { width: 7px; }
    ::-webkit-scrollbar-thumb { border-radius: 999px; background: var(--scrollbar); }
    @media (max-width: 720px) {
      :root { --sidebar: min(88vw, 360px); }
      .chats { gap: 10px; padding: 10px; }

  </style>
</head>

  <main class="chats" id="chats"></main>

  <script type="module">
    import { ChatView } from "/chat.js";
    const CHANNELS_KEY = "chzzk_multi_chat_channels";
    const CONFIG_KEY = "chzzk_multi_chat_config";
    const DEFAULT_CONFIG = { width: 360, height: 640, scale: 1, theme: "dark" };
    const $ = (selector) => document.querySelector(selector);
    let channels = load(CHANNELS_KEY, []);
    let config = { ...DEFAULT_CONFIG, ...load(CONFIG_KEY, {}) };
    let dragId = null;
    const chatViews = new Map();
    const DISCONNECT_DELAY = 3000;
    const channelStates = new Map();
    const channelRequests = new Set();
    let refreshingChannels = false;
    let lastChannelRefresh = 0;

    function load(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
      catch { return fallback; }
    }

    function saveChannels() { localStorage.setItem(CHANNELS_KEY, JSON.stringify(channels)); }
    function saveConfig() { localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }
    function clamp(value, min, max, fallback) {
      const number = Number(value);
      return Number.isFinite(number) ? Math.min(max, Math.max(min, number)) : fallback;
    }
    function setStatus(message = "", error = false) {
      $("#status").textContent = message;
      $("#status").classList.toggle("error", error);
    }
    function button(text, className, title, listener) {
      const element = document.createElement("button");
      element.type = "button";
      element.textContent = text;
      element.className = className;
      if (title) element.title = title;
      if (listener) element.addEventListener("click", listener);
      return element;
    }
    function profile(channel) {
      const className = `profile${channel.live ? " is-live" : ""}`;
      if (channel.image) {
        const image = document.createElement("img");
        image.src = channel.image;
        image.alt = "";
        image.loading = "lazy";
        image.className = className;
        image.draggable = false;
        image.addEventListener("error", () => image.replaceWith(profile({ ...channel, image: "" })), { once: true });
        return image;
      }
      const fallback = document.createElement("div");
      fallback.className = className;
      fallback.textContent = (channel.name || "?").slice(0, 1);
      return fallback;
    }

    function liveLabel(live) {
      const meta = document.createElement("div");
      meta.className = live ? "meta live" : "meta";
      meta.textContent = live ? "● LIVE" : live === false ? "오프라인" : "";
      return meta;
    }

    async function refreshChannel(channel) {
      if (channelRequests.has(channel.id)) return;
      channelRequests.add(channel.id);
      try {
        const response = await fetch(`/api/channel?channelId=${encodeURIComponent(channel.id)}`, { signal: AbortSignal.timeout(10000) });
        if (!response.ok) return;
        const data = await response.json();
        if (!channels.includes(channel)) return;
        const previous = channelStates.get(channel.id);
        channelStates.set(channel.id, data.live === true);
        const changed = (typeof data.name === "string" && data.name !== channel.name) || (typeof data.image === "string" && data.image !== channel.image);
        if (typeof data.name === "string") channel.name = data.name;
        if (typeof data.image === "string") channel.image = data.image;
        if (changed) {
          saveChannels();
        }
        if (changed || previous !== data.live) {
          const entry = chatViews.get(channel.id);
          if (entry) {
            const header = entry.wrapper.querySelector(".chat-header");
            header.querySelector(".name").textContent = channel.name;
            header.querySelector(".profile").replaceWith(profile({ ...channel, live: channelStates.get(channel.id) }));
          }
          renderChannelList();
        }
      } catch { /* Keep the last known state when a metadata request fails. */ }
      finally { channelRequests.delete(channel.id); }
    }

    async function refreshChannels() {
      if (refreshingChannels || document.hidden) return;
      refreshingChannels = true;
      lastChannelRefresh = Date.now();
      const pending = [...channels];
      // Limit parallel metadata requests even when many channels are saved.
      try {
        await Promise.all(Array.from({ length: Math.min(3, pending.length) }, async () => {
          while (pending.length) await refreshChannel(pending.shift());
        }));
      } finally { refreshingChannels = false; }
    }

    async function search() {
      const keyword = $("#search-input").value.trim();
      if (!keyword) {
        setStatus("검색할 스트리머 이름을 입력해 주세요.", true);
        $("#search-input").focus();
        return;
      }
      setStatus("검색 중...");
      $("#results").replaceChildren();
      $("#search-button").disabled = true;
      try {
        const response = await fetch(`/api/search?keyword=${encodeURIComponent(keyword)}&offset=0&size=8`);
        if (!response.ok) throw new Error("search failed");
        const payload = await response.json();
        const results = (payload.content?.data || []).map(({ channel }) => ({
          id: channel.channelId,
          name: channel.channelName,
          image: channel.channelImageUrl || "",
          live: Boolean(channel.openLive),
          selected: true
        }));
        renderResults(results);
        setStatus(results.length ? `${results.length}개의 채널을 찾았습니다.` : "검색 결과가 없습니다.");
      } catch {
        setStatus("검색에 실패했습니다. 잠시 후 다시 시도해 주세요.", true);
      } finally {
        $("#search-button").disabled = false;
      }
    }

    function renderResults(results) {
      const container = $("#results");
      container.replaceChildren();
      results.forEach((channel) => {
        const row = document.createElement("div");
        row.className = "result";
        const copy = document.createElement("div");
        copy.className = "copy";
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = channel.name;
        copy.append(name, liveLabel(channel.live));
        const exists = channels.some((saved) => saved.id === channel.id);
        const add = button(exists ? "추가됨" : "추가", "add");
        add.disabled = exists;
        add.addEventListener("click", () => {
          addChannel(channel);
          $("#results").replaceChildren();
          setStatus();
        });
        row.append(profile(channel), copy, add);
        container.appendChild(row);
      });
    }

    function addChannel(channel) {
      if (!channel.id || channels.some((saved) => saved.id === channel.id)) return;
      channels.push({ id: channel.id, name: channel.name || "직접 추가한 채널", image: channel.image || "", selected: true });
      if (typeof channel.live === "boolean") channelStates.set(channel.id, channel.live);
      saveChannels();
      renderChannelList();
      renderChats();
      refreshChannel(channels[channels.length - 1]);
    }

    function removeChannel(id) {
      const index = channels.findIndex(channel => channel.id === id);
      if (index < 0) return;
      channels.splice(index, 1);
      channelStates.delete(id);
      saveChannels();
      renderChannelList();
      renderChats();
    }

    function renderChannelList() {
      if (dragId !== null) return;
      const list = $("#channel-list");
      list.replaceChildren();
      if (!channels.length) {
        const empty = document.createElement("div");
        empty.className = "empty-list";
        empty.textContent = "위 검색창에서 스트리머를 찾아 추가해 주세요.";
        list.appendChild(empty);
        return;
      }
      const ordered = [...channels].sort((a, b) => Number(channelStates.get(b.id) === true) - Number(channelStates.get(a.id) === true));
      ordered.forEach((channel) => {
        const item = document.createElement("div");
        item.className = "channel-item";
        item.dataset.channelId = channel.id;
        item.draggable = true;
        item.addEventListener("dragstart", (event) => {
          dragId = channel.id;
          event.dataTransfer.setData("text/plain", channel.id);
          event.dataTransfer.effectAllowed = "move";
          item.classList.add("dragging");
        });
        item.addEventListener("dragend", () => { dragId = null; renderChannelList(); });
        item.addEventListener("dragover", (event) => event.preventDefault());
        item.addEventListener("drop", (event) => {
          event.preventDefault();
          const from = channels.findIndex(saved => saved.id === dragId);
          const to = channels.findIndex(saved => saved.id === channel.id);
          if (from < 0 || to < 0 || from === to) return;
          if ((channelStates.get(dragId) === true) !== (channelStates.get(channel.id) === true)) return;
          const [moved] = channels.splice(from, 1);
          channels.splice(to, 0, moved);
          dragId = null;
          saveChannels();
          renderChannelList();
          renderChats();
        });
        const handle = document.createElement("span");
        handle.className = "handle";
        handle.textContent = "⠿";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = channel.selected !== false;
        checkbox.title = "채팅창 표시";
        checkbox.setAttribute("aria-label", `${channel.name} 채팅창 표시`);
        checkbox.addEventListener("change", () => {
          channel.selected = checkbox.checked;
          saveChannels();
          renderChats();
        });
        const copy = document.createElement("div");
        copy.className = "copy";
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = channel.name;
        const live = channelStates.get(channel.id);
        copy.append(name, liveLabel(live));
        item.append(handle, checkbox, profile({ ...channel, live }), copy, button("×", "icon danger", "채널 삭제", () => removeChannel(channel.id)));
        list.appendChild(item);
      });
    }

    function renderChats() {
      const selected = channels.filter((channel) => channel.selected !== false);
      const chats = $("#chats");
      for (const [id, entry] of chatViews) {
        if (!selected.some(channel => channel.id === id)) {
          entry.wrapper.remove();
          // Keep one reusable connection briefly in case the channel was hidden by mistake.
          if (entry.disconnectTimer == null) {
            entry.disconnectTimer = setTimeout(() => {
              entry.view.dispose();
              chatViews.delete(id);
            }, DISCONNECT_DELAY);
          }
        }
      }
      chats.querySelector(".empty-state")?.remove();
      $("#count").textContent = selected.length;
      if (!selected.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.innerHTML = "<div><strong>표시할 채팅창이 없습니다</strong><span>왼쪽에서 스트리머를 검색해 추가하거나<br>추가한 채널의 체크박스를 켜 주세요.</span></div>";
        chats.appendChild(empty);
        return;
      }
      selected.forEach((channel) => {
        const existing = chatViews.get(channel.id);
        if (existing) {
          clearTimeout(existing.disconnectTimer);
          existing.disconnectTimer = null;
          existing.view.channel = channel;
          const header = existing.wrapper.querySelector(".chat-header");
          header.querySelector(".name").textContent = channel.name;
          header.querySelector(".profile").replaceWith(profile({ ...channel, live: channelStates.get(channel.id) }));
          chats.append(existing.wrapper);
          if (existing.view.follow) existing.view.scrollToBottom();
          return;
        }
        const wrapper = document.createElement("section");
        wrapper.className = "chat";
        const header = document.createElement("header");
        header.className = "chat-header";
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = channel.name;
        const actions = document.createElement("div");
        actions.className = "chat-actions";
        const open = document.createElement("a");
        open.className = "icon";
        open.href = `https://chzzk.naver.com/live/${encodeURIComponent(channel.id)}`;
        open.target = "_blank";
        open.rel = "noopener noreferrer";
        open.title = "방송 페이지 열기";
        open.textContent = "↗";
        const view = new ChatView(channel);
        const resizer = document.createElement("div");
        resizer.className = "chat-resizer";
        resizer.title = "드래그해서 모든 채팅창 크기 조절";
        resizer.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M6 12V6h6m0 12h6v-6"/></svg>';
        resizer.addEventListener("pointerdown", startChatResize);
        actions.append(open, button("↻", "icon", "이 채팅만 새로고침", () => view.refresh()));
        header.append(profile({ ...channel, live: channelStates.get(channel.id) }), name, actions);
        wrapper.append(header, view.notice, view.element, resizer);
        chatViews.set(channel.id, { wrapper, view });
        chats.appendChild(wrapper);
      });
    }

    function updateConfig(values = {}) {
      const following = [...chatViews.values()].filter(({ view, disconnectTimer }) => disconnectTimer == null && view.follow);
      config.width = Math.round(clamp(values.width ?? config.width, 240, 900, DEFAULT_CONFIG.width));
      config.height = Math.round(clamp(values.height ?? config.height, 320, 1200, DEFAULT_CONFIG.height));
      config.scale = clamp(values.scale ?? config.scale, 0.8, 1.5, DEFAULT_CONFIG.scale);
      document.documentElement.style.setProperty("--chat-width", config.width);
      document.documentElement.style.setProperty("--chat-height", config.height);
      document.documentElement.style.setProperty("--chat-scale", config.scale);
      $("#width-value").value = config.width;
      $("#height-value").value = config.height;
      $("#scale-value").value = Math.round(config.scale * 100);
      for (const [key, selector] of [["width", "#width-range"], ["height", "#height-range"], ["scale", "#scale-input"]]) {
        const range = $(selector);
        range.value = config[key];
        range.style.setProperty("--range-progress", `${(config[key] - Number(range.min)) / (Number(range.max) - Number(range.min)) * 100}%`);
      }
      saveConfig();
      requestAnimationFrame(() => {
        for (const { view } of following) if (!view.disposed) { view.follow = true; view.scrollToBottom(); }
      });
    }

    function applyTheme(theme) {
      config.theme = theme === "light" ? "light" : "dark";
      document.documentElement.dataset.theme = config.theme;
      const toggle = $("#theme-toggle");
      const nextTheme = config.theme === "dark" ? "light" : "dark";
      toggle.textContent = config.theme === "dark" ? "☀" : "☾";
      toggle.title = `${nextTheme === "light" ? "라이트" : "다크"} 모드로 전환`;
      toggle.setAttribute("aria-label", toggle.title);
      saveConfig();
    }

    function openSidebar() {
      $("#sidebar").classList.remove("collapsed");
      $("#sidebar-toggle").textContent = "‹";
      $("#sidebar-toggle").setAttribute("aria-label", "설정 패널 접기");
    }

    function isSidebarTarget(target) {
      return target instanceof Node && ($("#sidebar").contains(target) || $("#sidebar-hotspot").contains(target));
    }

    function leaveSidebar(event) {
      // Treat the fixed edge hotspot and panel as one hover area.
      if (!isSidebarTarget(event.relatedTarget)) closeSidebar();
    }

    function closeSidebar() {
      $("#sidebar").classList.add("collapsed");
      $("#sidebar-toggle").textContent = "›";
      $("#sidebar-toggle").setAttribute("aria-label", "설정 패널 펼치기");
      if ($("#sidebar").contains(document.activeElement)) document.activeElement.blur();
    }

    function startChatResize(event) {
      event.preventDefault();
      const handle = event.currentTarget;
      const startX = event.clientX;
      const startY = event.clientY;
      const startWidth = config.width;
      const startHeight = config.height;
      handle.setPointerCapture(event.pointerId);
      document.body.classList.add("resizing-chats");

      const resize = (moveEvent) => {
        updateConfig({
          width: startWidth + moveEvent.clientX - startX,
          height: startHeight + moveEvent.clientY - startY
        });
      };
      const finish = () => {
        document.body.classList.remove("resizing-chats");
        handle.removeEventListener("pointermove", resize);
        handle.removeEventListener("pointerup", finish);
        handle.removeEventListener("pointercancel", finish);
      };

      handle.addEventListener("pointermove", resize);
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    }

    function init() {
      updateConfig();
      renderChannelList();
      renderChats();
      refreshChannels();
      setInterval(refreshChannels, 60000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && Date.now() - lastChannelRefresh > 30000) refreshChannels();
      });
      $("#search-button").addEventListener("click", search);
      $("#search-input").addEventListener("keydown", (event) => { if (event.key === "Enter") search(); });
      $("#manual-button").addEventListener("click", () => {
        const input = $("#manual-input");
        addChannel({ id: input.value.trim() });
        input.value = "";
      });
      $("#width-range").addEventListener("input", (event) => updateConfig({ width: event.target.value }));
      $("#height-range").addEventListener("input", (event) => updateConfig({ height: event.target.value }));
      $("#scale-input").addEventListener("input", (event) => updateConfig({ scale: event.target.value }));
      $("#refresh-all").addEventListener("click", () => {
        for (const { view, disconnectTimer } of chatViews.values()) if (disconnectTimer == null) view.refresh();
      });
      $("#theme-toggle").addEventListener("click", () => {
        applyTheme(config.theme === "dark" ? "light" : "dark");
      });
      $("#reset").addEventListener("click", () => {
        if (!confirm("추가한 채널과 화면 설정을 모두 초기화할까요?")) return;
        localStorage.removeItem(CHANNELS_KEY);
        localStorage.removeItem(CONFIG_KEY);
        location.reload();
      });
      $("#sidebar-toggle").addEventListener("click", () => {
        if ($("#sidebar").classList.contains("collapsed")) openSidebar();
        else closeSidebar();
      });
      $("#sidebar-hotspot").addEventListener("mouseenter", openSidebar);
      $("#sidebar-hotspot").addEventListener("mouseleave", leaveSidebar);
      $("#sidebar").addEventListener("mouseleave", leaveSidebar);
      $("#sidebar").addEventListener("focusin", openSidebar);
      $("#sidebar").addEventListener("focusout", (event) => {
        if (!isSidebarTarget(event.relatedTarget) && !$("#sidebar").matches(":hover") && !$("#sidebar-hotspot").matches(":hover")) closeSidebar();
      });
      document.addEventListener("mouseout", (event) => {
        if (!event.relatedTarget) closeSidebar();
      });
      window.addEventListener("blur", closeSidebar);
      applyTheme(config.theme);
      $("#sidebar-toggle").textContent = "›";
      $("#sidebar-toggle").setAttribute("aria-label", "설정 패널 펼치기");
    }

    init();
  </script>
</body>
</html>
